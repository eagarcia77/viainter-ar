<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcador HIRO | Vía Inter SG</title>
  <style>
    body { margin:0; font-family:Arial, Helvetica, sans-serif; background:#f4f8f6; color:#14211d; display:grid; place-items:center; min-height:100vh; padding:24px; }
    main { background:#fff; padding:30px; border-radius:24px; box-shadow:0 24px 60px rgba(0,0,0,.15); max-width:720px; text-align:center; }
    h1 { color:#007B5F; margin-top:0; }
    img { width:min(420px, 80vw); border:20px solid #fff; box-shadow:0 10px 28px rgba(0,0,0,.18); }
    .note { background:rgba(254,209,65,.18); border-left:5px solid #FED141; padding:14px; border-radius:14px; text-align:left; line-height:1.6; }
    @media print { body{background:#fff;} main{box-shadow:none;} .note{display:none;} }
  </style>
</head>
<body>
  <main>
    <h1>Marcador para activar el mapa AR</h1>
    <p>Imprime esta página o muéstrala en otra pantalla. Luego abre <strong>marker-ar.html</strong> desde el celular y apunta la cámara al marcador.</p>
    <img alt="Marcador HIRO para AR.js" src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" />
    <p class="note">Para mejores resultados: usa buena iluminación, evita reflejos y mantén el marcador plano sobre una mesa.</p>
  </main>
</body>
</html>
