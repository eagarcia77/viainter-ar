<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mapa conceptual del Recinto de San Germán</title>
  <desc id="desc">Mapa visual editable para experiencia de realidad aumentada Vía Inter SG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f3"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <style>
      .road{fill:none;stroke:#c4d7d0;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
      .path{fill:none;stroke:#fed141;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20 16}
      .building{filter:url(#shadow);stroke:#005f49;stroke-width:4;rx:18;ry:18}
      .label{font-family:Arial, Helvetica, sans-serif;font-weight:700;fill:#14211d;font-size:24px;text-anchor:middle}
      .small{font-size:18px;fill:#51635d;font-weight:600}
      .pin{fill:#fed141;stroke:#007b5f;stroke-width:5}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="38" y="38" width="1124" height="684" rx="38" fill="#ffffff" stroke="#007b5f" stroke-width="8"/>
  <text x="600" y="95" class="label" font-size="38">Vía Inter SG · Mapa del Campus en AR</text>
  <text x="600" y="128" class="small" text-anchor="middle">Versión conceptual editable — sustituir por plano oficial si está disponible</text>
  <path class="road" d="M140 610 C310 510, 390 500, 555 532 C710 560, 825 535, 1030 430"/>
  <path class="road" d="M230 170 C360 260, 500 300, 660 292 C820 285, 930 250, 1048 175"/>
  <path class="road" d="M590 170 C560 300, 555 430, 555 620"/>
  <path class="path" d="M190 590 C300 438, 423 398, 558 390 C700 382, 810 342, 1000 190"/>
  <rect class="building" x="115" y="188" width="185" height="112" fill="#d9f0e8"/>
  <circle class="pin" cx="207" cy="188" r="18"/>
  <text x="207" y="250" class="label">Entrada</text>
  <text x="207" y="278" class="small" text-anchor="middle">Principal</text>
  <rect class="building" x="395" y="188" width="205" height="125" fill="#d9f0e8"/>
  <circle class="pin" cx="497" cy="188" r="18"/>
  <text x="497" y="253" class="label">Biblioteca</text>
  <rect class="building" x="690" y="176" width="210" height="128" fill="#fff3bf"/>
  <circle class="pin" cx="795" cy="176" r="18"/>
  <text x="795" y="238" class="label">Admisiones</text>
  <text x="795" y="266" class="small" text-anchor="middle">Servicios</text>
  <rect class="building" x="184" y="420" width="230" height="138" fill="#d9f0e8"/>
  <circle class="pin" cx="299" cy="420" r="18"/>
  <text x="299" y="489" class="label">Centro de</text>
  <text x="299" y="518" class="label">Estudiantes</text>
  <rect class="building" x="690" y="430" width="245" height="136" fill="#e8f6ff"/>
  <circle class="pin" cx="812" cy="430" r="18"/>
  <text x="812" y="499" class="label">UCAN / CETL</text>
  <text x="812" y="528" class="small" text-anchor="middle">Apoyo académico</text>
  <rect x="87" y="642" width="320" height="42" rx="21" fill="#007b5f"/>
  <text x="247" y="670" font-family="Arial" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Escanea · Explora · Oriéntate</text>
  <g transform="translate(1000,620)">
    <rect x="0" y="0" width="110" height="60" rx="16" fill="#fed141" stroke="#007b5f" stroke-width="4"/>
    <text x="55" y="38" font-family="Arial" font-size="22" font-weight="800" fill="#14211d" text-anchor="middle">AR</text>
  </g>
</svg>
